stages:
  - build
  - test

default:
  image: gradle:9.3-jdk17
  cache:
    - key:
        files:
          - gradle/wrapper/gradle-wrapper.properties
      paths:
        - .gradle/wrapper
        - .gradle/notifications
    - key: "$CI_COMMIT_REF_SLUG"
      paths:
        - .gradle/caches
        - .gradle/configuration-cache

variables:
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

build:
  stage: build
  rules:
    - when: always
  script:
    - ./gradlew build koverLog -x app:integTest -x app:e2eTest
  artifacts:
    paths:
      - build/reports
      - app/build
    reports:
      junit: "app/build/test-results/**/TEST-*.xml"
    expire_in: 1 week

integration_tests:
  stage: test
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - when: on_success
  dependencies:
    - build
  before_script:
    - apk add --no-cache openjdk17-jdk bash
  script:
    - ./gradlew app:integTest -x app:e2eTest koverLog
  artifacts:
    when: always
    reports:
      junit: "app/build/test-results/**/TEST-*.xml"
    expire_in: 1 week

e2e_tests:
  stage: test
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_PROJECT_PATH == "dagadeta-public/discord-bot"'
      when: on_success
    - when: never
  dependencies:
    - build
  before_script:
    - apk add --no-cache openjdk17-jdk bash
  script:
    - ./gradlew app:e2eTest -x app:integTest koverXmlReport koverLog
  coverage: '/Code Coverage: \d+\.\d+%/' # Regex to extract coverage from koverLog
  artifacts:
    when: always
    reports:
      junit: "app/build/test-results/**/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: "app/build/reports/kover/report.xml"
    expire_in: 1 week
