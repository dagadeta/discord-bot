name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build with Gradle
        run: ./gradlew build -x app:integTest -x app:e2eTest
      - name: Run integration tests
        run: ./gradlew app:integTest -x app:e2eTest
      - name: Run e2e tests
        if: ${{ github.repository == 'dagadeta/discord-bot' }}
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          GUILD_ID: ${{ vars.GUILD_ID }}
          LOGGING_CHANNEL_ID: ${{ vars.LOGGING_CHANNEL_ID }}
          ADMIN_ROLE_ID: ${{ vars.ADMIN_ROLE_ID }}
          ADMIN_CHANNEL_ID: ${{ vars.ADMIN_CHANNEL_ID }}
          WIKTIONARY_USER_AGENT: ${{ vars.WIKTIONARY_USER_AGENT }}
        run: ./gradlew app:e2eTest
      - name: Generate coverage report
        run: ./gradlew koverXmlReport koverLog -x app:e2eTest
      - name: Test Report
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        if: ${{ !cancelled() }}  # run this step even if a previous step failed
        with:
          name: JUnit Tests
          path: ${{ github.workspace }}/**/build/test-results/**/TEST-*.xml
          reporter: java-junit
      - name: Add coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: ${{ github.workspace }}/**/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: Code Coverage
          update-comment: true
          comment-type: ${{ github.event_name == 'pull_request' && 'both' || 'summary' }}
          fail-emoji: ':apple:'
          pass-emoji: ':green_apple:'
  secret-detection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
